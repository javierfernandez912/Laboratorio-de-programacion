<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Catálogo | Gestión de Libros Digitales</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <header class="bg-dark text-white text-center py-4 mb-4">
        <div class="container">
            <h1 class="m-0 fw-bold">Gestión de Libros Digitales</h1>
            <div class="small text-secondary">Catálogo Completo de Libros</div>
        </div>
    </header>

    <main class="container mb-5">
        <div class="card shadow-sm p-4 bg-white rounded">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="m-0 text-dark fw-bold">Libros Registrados</h3>
                <a th:href="@{/libros/nuevo}" class="btn btn-success fw-bold">Cargar Nuevo Libro</a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle border">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Editorial</th>
                            <th>Año</th>
                            <th>Género</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="l : ${libros}">
                            <td th:text="${l.id}" class="fw-bold">1</td>
                            <td th:text="${l.titulo}">Título</td>
                            <td th:text="${l.autor}">Autor</td>
                            <td th:text="${l.editorial}">Editorial</td>
                            <td th:text="${l.anioEdicion}">2026</td>
                            <td th:text="${l.genero.nombre}">Género</td>
                            <td class="text-center">
                                <a th:href="@{/libros/editar/{id}(id=${l.id})}"
                                    class="btn btn-primary btn-sm me-1 fw-bold">Modificar</a>
                                <a th:href="@{/libros/eliminar/{id}(id=${l.id})}"
                                    onclick="return confirm('¿Estás seguro de que querés eliminar este libro digital?');"
                                    class="btn btn-danger btn-sm fw-bold">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container small">
            Laboratorio de Programación 2026 | TP N°6 | Javier Fernandez
        </div>
    </footer>

</body>

</html>
