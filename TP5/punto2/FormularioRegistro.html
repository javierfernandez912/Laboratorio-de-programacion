<!DOCTYPE HTML>
<html>

<head>
    <title>Inicio | Formulario de Registro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">

                <h2 class="text-center mb-4 fw-normal text-dark">Formulario de Registro</h2>

                <div class="card shadow-sm p-4 bg-white rounded">

                    <div class="alert alert-info py-2 px-3 mb-4 border-0 rounded text-info-emphasis" role="alert">
                        Ud. está a punto de registrarse.
                    </div>

                    <form id="formulario_registro" novalidate>

                        <div class="mb-3">
                            <label for="nombre" class="form-label text-secondary fw-semibold">Nombre Completo</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Escribe tu nombre completo"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label text-secondary fw-semibold">Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" placeholder="ejemplo@dominio.com"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label text-secondary fw-semibold">Contraseña</label>
                            <input type="password" id="password" class="form-control" placeholder="Crea una contraseña"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label text-secondary fw-semibold">Confirmar
                                Contraseña</label>
                            <input type="password" id="confirm_password" class="form-control"
                                placeholder="Repite tu contraseña" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold d-block">Género</label>

                            <div class="form-check mb-1">
                                <input class="form-check-input" type="radio" name="genero" id="generoMasculino"
                                    value="masculino">
                                <label class="form-check-label text-dark" for="generoMasculino">Masculino</label>
                            </div>

                            <div class="form-check mb-1">
                                <input class="form-check-input" type="radio" name="genero" id="generoFemenino"
                                    value="femenino">
                                <label class="form-check-label text-dark" for="generoFemenino">Femenino</label>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="genero" id="generoOtro" value="otro">
                                <label class="form-check-label text-dark" for="generoOtro">Otro</label>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terminos" required>
                            <label class="form-check-label text-dark" for="terminos">
                                Acepto los <a href="#" class="text-decoration-underline text-primary">Términos y
                                    Condiciones</a>
                            </label>
                        </div>

                        <div class="mb-4">
                            <label for="pais" class="form-label text-secondary fw-semibold">País</label>
                            <select id="pais" class="form-select text-secondary" required>
                                <option value="" selected disabled>Selecciona tu país</option>
                                <option value="pais1">País 1</option>
                                <option value="pais2">País 2</option>
                                <option value="pais3">País 3</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Registrar</button>

                    </form>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
