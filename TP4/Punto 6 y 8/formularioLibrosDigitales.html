<!DOCTYPE HTML>
<html>

<head>
    <title>Libros Digitales</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <form action="#" id="formulario_libros" novalidate>
        <!--No validate ignora todos los required, y la validacion la hace solamente el .js-->
        <h2>Datos del Libro</h2>
        <label>ID:</label>
        <input type="number" id="id" name="id" required min="00001" max="99999" placeholder="00001"
            title="El formato debe ser 00000 (5 números)">
        <br>
        <label>Titulo:</label>
        <input type="text" id="titulo" name="titulo" required placeholder="Titulo del libro">
        <br>
        <label>Autor:</label>
        <input type="text" id="autor" name="autor" required placeholder="Nombre del autor">
        <br>
        <label>Editorial:</label>
        <input type="text" id="editorial" name="editorial" required placeholder="Nombre de la editorial">
        <br>
        <label>Año de edición:</label>
        <input type="number" id="anio_edicion" name="anio_edicion" required min="1000" max="2026"
            placeholder="Ej: 2020">
        <br>
        <br>
        <h2>Datos del género</h2>
        <label>ID:</label>
        <input type="number" id="id_genero" name="id_genero" required min="00001" max="99999" placeholder="00001">
        <br>
        <label>Nombre del género:</label>
        <input type="text" id="nombre_genero" name="nombre_genero" required placeholder="Ej: Comedia">
        <br>
        <br>
        <div id="contenedor_errores"></div>
        <input type="submit" value="Cargar libro">
        <br>
        <br>
        <br>
        <input type="reset" value="Limpiar">
    </form>
    <script src="validacionLibros.js"></script>
</body>

</html>
